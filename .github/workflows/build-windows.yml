name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target HORDE_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: HORDE-VST3-Windows-x64
          path: build/HORDE_artefacts/Release/VST3/HORDE.vst3
